services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simplehelpdesk:local
    ports:
      # HOST_PORT:CONTAINER_PORT — change the left-hand side to expose the
      # app on a different host port; the right-hand side must match PORT/
      # HTTPS_PORT below and the Dockerfile's EXPOSE. See README.md
      # "Configuring the port" and "Running over HTTPS".
      - '8080:8080'   # plain HTTP — redirects to HTTPS once certs/ is mounted below
      - '4443:4443'   # HTTPS — the actual app
    environment:
      PORT: '8080'
      HTTPS_PORT: '4443'
      # All app data (users/tickets/messages/attachment metadata) lives in
      # Supabase Postgres now, not a local file — see README's "Connecting
      # to Supabase" — so these three replace the old data/db.json volume.
      # Sourced from the host's .env via env_file below; SUPABASE_URL and
      # SUPABASE_SERVICE_ROLE_KEY must both be set there.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    env_file:
      - path: ./.env
        required: false
    volumes:
      # TLS cert/key (see README.md "Running over HTTPS" — generate with
      # `npm run certs:generate` or drop in a real certificate). Read-only;
      # missing this entirely just falls back to HTTP-only on PORT.
      - ./certs:/app/certs:ro
    restart: unless-stopped
