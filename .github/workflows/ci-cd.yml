name: CI/CD

# Every push/PR runs build+typecheck, unit tests, and the full Playwright
# regression suite. Only a push to main (i.e. a merged PR) goes on to build
# the Docker image and walk it through staging -> production. Each stage
# gates the next — a failure anywhere stops the pipeline before it reaches
# deployment. Unit tests run in parallel with build-and-typecheck (both are
# fast) so the slower Playwright suite only starts once both have passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-typecheck:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck + build client and server
        run: npm run build

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run server unit tests with coverage
        run: npm run test:unit:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: server/coverage/
          retention-days: 14

  regression-tests:
    name: Regression tests (Playwright)
    needs: [build-and-typecheck, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Chromium only in CI: the "edge" project (playwright.config.ts) drives
      # the system-installed Microsoft Edge via channel:'msedge', which
      # ubuntu-latest runners don't ship. Run it locally/on Windows if you
      # need edge-specific coverage — see README.md "Multi-browser execution".
      - run: npx playwright install --with-deps chromium
      - name: Run the full Playwright suite (this is the merge/deploy gate)
        run: npx playwright test --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build-and-push-image:
    name: Build & push Docker image
    needs: regression-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: staging # auto-deploys; add required reviewers only on "production" below
    steps:
      - name: Deploy image to staging
        run: |
          echo "TODO: pull and run ${{ needs.build-and-push-image.outputs.image }} on the staging host."
          echo "e.g. SSH in and run: docker compose pull && docker compose up -d"
          echo "Wire this up with real deploy credentials once a staging host/target exists — see README.md 'CI/CD pipeline'."

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Configure this environment in GitHub: Settings -> Environments ->
    # "production" -> Required reviewers. That's what turns this job into a
    # manual-approval gate — nothing in this YAML enforces it by itself.
    environment: production
    steps:
      - name: Deploy image to production
        run: |
          echo "TODO: pull and run ${{ needs.build-and-push-image.outputs.image }} on the production host."
          echo "Wire this up with real deploy credentials once a production host/target exists — see README.md 'CI/CD pipeline'."
